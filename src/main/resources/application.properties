spring.application.name=vmo

# Database Configuration
spring.datasource.url=jdbc:mysql://epindiaserver.mysql.database.azure.com:3306/vmo
spring.datasource.username=epiadmin
spring.datasource.password=nagarjun@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server Configuration
server.port=8080

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true
spring.mvc.cors.max-age=3600

# Bean Configuration
spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.example.vmo=DEBUG
